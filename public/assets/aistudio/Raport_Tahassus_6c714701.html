:root{

  --gD:#A63A12; --gD-bg:#FADBCB; --gE:#A3121F; --gE-bg:#F8D3D6;
  --font-display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-doc:'Source Serif 4',Georgia,'Times New Roman',serif;
}

  --gA:#7FE0A6; --gA-bg:#163B27; --gB:#8CC8F0; --gB-bg:#14344A; --gC:#F2CB6B; --gC-bg:#40320F;
  --gD:#F5A27C; --gD-bg:#47251A; --gE:#F59AA2; --gE-bg:#4A1D22; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#4FD1AE; --accent-ink:#06231C; --accent-soft:#17382F; --focus:#4FD1AE;
  --gA:#7FE0A6; --gA-bg:#163B27; --gB:#8CC8F0; --gB-bg:#14344A; --gC:#F2CB6B; --gC-bg:#40320F;
  --gD:#F5A27C; --gD-bg:#47251A; --gE:#F59AA2; --gE-bg:#4A1D22; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.bar-top{display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:22px;font-weight:700;line-height:1.1}

.right{display:flex;align-items:center;gap:12px}
.saved{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}

.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}

.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-top:22px;display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:17px;font-weight:700}
.sec-head .hint{color:var(--muted);font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat{padding:14px 18px;min-width:0;border-left:1px solid var(--line)}

.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* chips */
.chip{display:inline-block;min-width:24px;text-align:center;padding:1px 8px;border-radius:6px;font-weight:700;font-size:12.5px}
.g-A{background:var(--gA-bg);color:var(--gA)}.g-B{background:var(--gB-bg);color:var(--gB)}
.g-C{background:var(--gC-bg);color:var(--gC)}.g-D{background:var(--gD-bg);color:var(--gD)}
.g-E{background:var(--gE-bg);color:var(--gE)}.g-X{background:var(--surface2);color:var(--muted)}

.dist{display:flex;flex-direction:column;gap:8px}
.dist-row{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:10px}
.dist-track{height:18px;background:var(--surface2);border-radius:5px;overflow:hidden}
.dist-fill{height:100%;border-radius:5px;min-width:0}
.f-A{background:var(--gA)}.f-B{background:var(--gB)}.f-C{background:var(--gC)}.f-D{background:var(--gD)}.f-E{background:var(--gE)}
.dist-row .n{text-align:right;font-weight:700}
.rng{display:flex;flex-direction:column;gap:12px}
.rng-row{display:grid;grid-template-columns:78px 1fr 46px;align-items:center;gap:10px}
.rng-lab{font-weight:600;font-size:13px}
.rng-track{position:relative;height:22px}
.rng-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.rng-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.8}
.rng-band{position:absolute;top:6px;height:10px;border-radius:5px;background:var(--accent-soft);border:1px solid var(--accent)}
.rng-dot{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.rng-val{text-align:right;font-weight:700}
.rng-axis{position:relative;height:16px;margin-left:88px;margin-right:56px;font-size:11px;color:var(--muted)}
.rng-axis span{position:absolute;transform:translateX(-50%)}
.legend{font-size:12px;color:var(--muted);margin:10px 0 0}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface2)}

td.name{white-space:normal;min-width:170px;font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.prog{display:inline-flex;align-items:center;gap:8px}
.prog i{display:block;width:54px;height:6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent)}
.sortbtn{border:0;background:none;cursor:pointer;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:0}
.sortbtn[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

.attn{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.attn li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.attn button{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600}

.muted{color:var(--muted)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp-row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center}
.cmp-row.me .cmp-lab{color:var(--accent)}

.doc table{width:100%;border:1px solid var(--paper-line)}

.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

};
const TABS = [['rekap','Rekap kelas'],['nilai','Input nilai'],['siswa','Data siswa'],['raport','Raport'],['setelan','Pengaturan']];

/* ---------- state ---------- */
let S, ui = {kelas:'4', tab:'rekap', sort:'nilai', sid:{}};
let uidN = 0; const uid = () => 's' + Date.now().toString(36) + (uidN++);
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(){
  let o = null;
  try { const r = localStorage.getItem(KEY); if (r) { o = JSON.parse(r); } } catch(e) { o = null; }
  if (!o || !o.classes) o = clone(SEED);
  Object.values(o.classes).forEach(a => a.forEach(s => { if (!s.id) s.id = uid(); }));
  return o;
}
let saveTimer;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  const el = document.getElementById('saved'); if (!el) return;
  el.textContent = 'Tersimpan'; clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { el.textContent = ''; }, 1800);
}

/* ---------- hitung ---------- */
const mean = a => a.reduce((x,y) => x + y, 0) / a.length;
function pred(v){ if (v == null || isNaN(v)) return null; return v >= 90 ? 'A' : v >= 80 ? 'B' : v >= 70 ? 'C' : v >= 60 ? 'D' : 'E'; }
function fmt(v, d = 1){ if (v == null || isNaN(v)) return '–'; return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d).replace('.', ','); }
function surahVal(a){ const v = a.filter(x => x != null); return v.length ? mean(v) : null; }
function calc(st){
  const keys = Object.keys(st.s);
  const cat = j => { const v = keys.map(k => st.s[k][j]).filter(x => x != null); return v.length ? mean(v) : null; };
  const t = cat(0), m = cat(1), l = cat(2), p = [t, m, l].filter(x => x != null);
  const f = p.length ? mean(p) : null;
  return {t, m, l, f, g: pred(f), n: keys.length};
}
const chip = g => `<span class="chip g-${g || 'X'}">${g || '–'}</span>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const students = () => S.classes[ui.kelas] || [];
function cur(){
  const a = students(); if (!a.length) return null;
  return a.find(s => s.id === ui.sid[ui.kelas]) || a[0];
}
function classStats(k){
  const a = (S.classes[k] || []).map(s => ({s, c: calc(s)})).filter(x => x.c.f != null);
  return {n: (S.classes[k] || []).length, avg: a.length ? mean(a.map(x => x.c.f)) : null, rows: a};
}

/* ---------- chrome ---------- */
function drawChrome(){
  $('#subtitle').textContent = `${S.school.nama} · Semester ${S.school.semester} · ${S.school.tahun}`;
  $('#kelasSeg').innerHTML = ['4','5','6'].map(k => `<button type="button" data-act="kelas" data-k="${k}" aria-pressed="${ui.kelas === k}">Kelas ${k}</button>`).join('');
  $('#tabs').innerHTML = TABS.map(([id, l]) => `<button type="button" role="tab" data-act="tab" data-t="${id}" aria-selected="${ui.tab === id}">${l}</button>`).join('');
}
function render(){
  drawChrome();
  const v = {rekap: vRekap, nilai: vNilai, siswa: vSiswa, raport: vRaport, setelan: vSetelan}[ui.tab];
  $('#view').innerHTML = v();
  if (ui.tab === 'nilai') bindNilai();
}

/* ---------- rekap ---------- */
function vRekap(){
  const cs = classStats(ui.kelas), rows = cs.rows;
  if (!rows.length) return `<div class="panel empty-state">Belum ada nilai di Kelas ${ui.kelas}. Isi nilai di tab Input nilai.</div>`;
  const fs = rows.map(x => x.c.f), avg = mean(fs);
  const top = rows.reduce((a, b) => b.c.f > a.c.f ? b : a);
  const low = rows.filter(x => x.c.f < 80).sort((a, b) => a.c.f - b.c.f);
  const dist = {A:0,B:0,C:0,D:0,E:0}; rows.forEach(x => dist[x.c.g]++);
  const mx = Math.max(1, ...Object.values(dist));
  const stat = (lab, fn) => ({lab, ...fn});
  const aspects = [['Tajwid','t'],['Makhroj','m'],['Kelancaran','l'],['Nilai akhir','f']].map(([lab, key]) => {
    const v = rows.map(x => x.c[key]).filter(x => x != null);
    return {lab, min: Math.min(...v), max: Math.max(...v), avg: mean(v)};
  });
  const pos = v => Math.max(0, Math.min(100, (v - 60) / 40 * 100));
  const ticks = [60,70,80,90,100];
  const rng = aspects.map(a => `
    <div class="rng-row"><span class="rng-lab">${a.lab}</span>
      <div class="rng-track" title="Terendah ${fmt(a.min)}, tertinggi ${fmt(a.max)}, rata-rata ${fmt(a.avg)}">
        ${ticks.slice(1,4).map(t => `<i class="rng-grid" style="left:${pos(t)}%"></i>`).join('')}
        <div class="rng-band" style="left:${pos(a.min)}%;width:${Math.max(1, pos(a.max) - pos(a.min))}%"></div>
        <div class="rng-dot" style="left:${pos(a.avg)}%"></div>
      </div><span class="rng-val num">${fmt(a.avg)}</span></div>`).join('');
  const cmp = ['4','5','6'].map(k => { const c = classStats(k); return `
    <div class="cmp-row ${k === ui.kelas ? 'me' : ''}"><span class="cmp-lab">Kelas ${k}</span>
      <span class="muted num">${c.n} siswa</span><span class="num"><b>${fmt(c.avg)}</b> ${chip(pred(c.avg))}</span></div>`; }).join('');
  const sorted = rows.slice().sort((a, b) =>
    ui.sort === 'nama' ? a.s.nama.localeCompare(b.s.nama) :
    ui.sort === 'hafalan' ? b.c.n - a.c.n || b.c.f - a.c.f : b.c.f - a.c.f);
  const sb = (id, l) => `<button type="button" class="sortbtn" data-act="sort" data-s="${id}" aria-pressed="${ui.sort === id}">${l}</button>`;
  const body = sorted.map((x, i) => `
    <tr class="click" data-act="open" data-id="${x.s.id}" tabindex="0">
      <td class="num muted">${i + 1}</td><td class="name">${esc(x.s.nama)}</td>
      <td>${esc(x.s.jilid) || '<span class="muted">–</span>'}</td>
      <td><span class="prog"><i><b style="width:${Math.round(x.c.n / 37 * 100)}%"></b></i><span class="num">${x.c.n}/37</span></span></td>
      <td class="r num">${fmt(x.c.t)}</td><td class="r num">${fmt(x.c.m)}</td><td class="r num">${fmt(x.c.l)}</td>
      <td class="r num"><b>${fmt(x.c.f)}</b></td><td>${chip(x.c.g)}</td></tr>`).join('');
  return `
  <section class="stats" aria-label="Ringkasan kelas ${ui.kelas}">
    <div class="stat"><div class="k">Siswa dinilai</div><div class="v num">${rows.length}</div><div class="s">dari ${cs.n} siswa</div></div>
    <div class="stat"><div class="k">Rata-rata kelas</div><div class="v num">${fmt(avg)}</div><div class="s">predikat ${pred(avg)}</div></div>
    <div class="stat"><div class="k">Nilai tertinggi</div><div class="v num">${fmt(top.c.f)}</div><div class="s">${esc(top.s.nama)}</div></div>
    <div class="stat"><div class="k">Di bawah 80</div><div class="v num">${low.length}</div><div class="s">predikat C atau lebih rendah</div></div>
  </section>
  <section class="grid2">
    <div class="panel"><div class="sec-head"><h2>Sebaran predikat</h2><span class="hint">jumlah siswa</span></div>
      <div class="dist">${['A','B','C','D','E'].map(g => `
        <div class="dist-row">${chip(g)}<div class="dist-track"><div class="dist-fill f-${g}" style="width:${dist[g] / mx * 100}%"></div></div><span class="n num">${dist[g]}</span></div>`).join('')}</div>
      <p class="legend">A ≥ 90 · B 80–89 · C 70–79 · D 60–69 · E &lt; 60</p></div>
    <div class="panel"><div class="sec-head"><h2>Rentang nilai per aspek</h2><span class="hint">titik = rata-rata, pita = terendah ke tertinggi</span></div>
      <div class="rng">${rng}</div>
      <div class="rng-axis" aria-hidden="true">${ticks.map(t => `<span style="left:${pos(t)}%">${t}</span>`).join('')}</div>
      <p class="legend">Skala dimulai dari 60.</p></div>
  </section>
  <section class="grid2">
    <div class="panel"><div class="sec-head"><h2>Perlu perhatian</h2><span class="hint">nilai akhir di bawah 80</span></div>
      ${low.length ? `<ul class="attn">${low.map(x => `<li><button type="button" data-act="open" data-id="${x.s.id}">${esc(x.s.nama)}</button><span class="num"><b>${fmt(x.c.f)}</b> ${chip(x.c.g)}</span></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">Semua siswa bernilai 80 ke atas.</p>'}</div>
    <div class="panel"><div class="sec-head"><h2>Rata-rata per kelas</h2><span class="hint">nilai akhir</span></div><div class="cmp">${cmp}</div></div>
  </section>
  <section>
    <div class="sec-head"><h2>Peringkat Kelas ${ui.kelas}</h2><span class="hint">Klik baris untuk membuka raport</span></div>

function assemblePdf(pages, imgs){
  const chunks = []; let off = 0; const offs = [];
  const put = b => { const u = typeof b === 'string' ? Uint8Array.from(b, c => c.charCodeAt(0) & 255) : b; chunks.push(u); off += u.length; };
  const ik = Object.keys(imgs), io = {}; let n = 5; ik.forEach(k => { io[k] = n++; });
  const po = pages.map(() => { const p = n; n += 2; return p; }), total = n - 1;
  const obj = (id, fn) => { offs[id] = off; put(id + ' 0 obj\n'); fn(); put('\nendobj\n'); };
  put('%PDF-1.4\n');
  obj(1, () => put('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2, () => put('<</Type/Pages/Count ' + pages.length + '/Kids[' + po.map(p => p + ' 0 R').join(' ') + ']>>'));
  obj(3, () => put('<</Type/Font/Subtype/Type1/BaseFont/Times-Roman/Encoding/WinAnsiEncoding>>'));
  obj(4, () => put('<</Type/Font/Subtype/Type1/BaseFont/Times-Bold/Encoding/WinAnsiEncoding>>'));
  ik.forEach(k => { const im = imgs[k]; obj(io[k], () => { put(`<</Type/XObject/Subtype/Image/Width ${im.w}/Height ${im.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${im.bytes.length}>>\nstream\n`); put(im.bytes); put('\nendstream'); }); });
  const xo = ik.map(k => `/${k} ${io[k]} 0 R`).join(' ');
  pages.forEach((ops, i) => {
    const p = po[i];
    obj(p, () => put(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>/XObject<<${xo}>>>>/Contents ${p + 1} 0 R>>`));
    obj(p + 1, () => { put(`<</Length ${ops.length}>>\nstream\n`); put(ops); put('\nendstream'); });
  });
  const xr = off; let x = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
  for (let i = 1; i <= total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  put(x + `trailer\n<</Size ${total + 1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  const out = new Uint8Array(off); let p = 0; chunks.forEach(c => { out.set(c, p); p += c.length; });
  return out.buffer;
}
async function buildPdf(list){

  return assemblePdf(list.map(st => drawPage(st, S.school, imgs)), imgs);
}
async function savePdf(all){

  const list = all ? students().slice() : (cur() ? [cur()] : []);
  if (!list.length) return;
  m.className = 'notice'; m.textContent = 'Menyiapkan PDF…';
  try {
    const buf = await buildPdf(list);

function readLogo(inp){
  const f = inp.files && inp.files[0], side = inp.dataset.logo, m = $('#logomsg');
  if (!f) return;
  const fail = t => { m.className = 'notice err'; m.textContent = t; };
  if (!/^image\//.test(f.type)) { fail('File harus berupa gambar (PNG atau JPG).'); return; }
  const fr = new FileReader();
  fr.onerror = () => fail('Gambar tidak bisa dibaca. Coba file lain.');
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => fail('Gambar tidak bisa dibuka. Coba file PNG atau JPG lain.');
    im.onload = () => {
      const w = im.width || 240, h = im.height || 240, r = Math.min(1, 240 / Math.max(w, h));
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * r)); cv.height = Math.max(1, Math.round(h * r));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      S.school['logo' + side] = cv.toDataURL('image/png'); save(); render();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}
let armed = {};
